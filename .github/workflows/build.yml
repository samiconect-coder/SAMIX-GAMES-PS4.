
name: Build SAMIX GAMES

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Build with OpenOrbis Docker
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            make

      - name: Save build files
        uses: actions/upload-artifact@v4
        with:
          name: SAMIX-GAMES-build
          path: |
            eboot.bin
            build/
          if-no-files-found: warn
          
